name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12']
        include:
          - os: ubuntu-latest
            python: '3.9'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System libraries for the official NuSMV build (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxml2 libedit2
      - name: System libraries for the official NuSMV build (macOS)
        if: runner.os == 'macOS'
        run: brew install gmp libedit
      - run: pip install . pytest
      - name: Download NuSMV (same path end users take)
        run: smv-tracelab --install-nusmv
      - name: NuSMV smoke test
        shell: bash
        run: |
          printf 'MODULE main\nVAR x : boolean;\nCTLSPEC AG x\n' > smoke.smv
          python - <<'PY'
          import subprocess, sys
          from smv_tracelab.nusmv_bin import find_nusmv, runtime_env
          exe = find_nusmv(); env, missing = runtime_env(exe)
          print(exe, 'missing:', missing)
          r = subprocess.run([exe, 'smoke.smv'], env=env, capture_output=True, text=True)
          print(r.stdout[-400:], r.stderr[-400:])
          sys.exit(0 if 'is false' in r.stdout else 1)
          PY
      - name: ConPTY probe (Windows diagnostics)
        if: runner.os == 'Windows'
        working-directory: examples
        run: |
          python -c "import time; from smv_tracelab import proc; from smv_tracelab.nusmv_bin import find_nusmv; p = proc.spawn([find_nusmv(), '-int', 'counter.smv'], cwd='.'); time.sleep(3); print(repr(p.read(1)[-600:])); [(p.write(c + '\n'), time.sleep(2), print('>>>', c, repr(p.read(1)[:1500]))) for c in ['go', 'show_vars -i', 'pick_state -i -a']]"
      - run: python -m pytest -v tests
        timeout-minutes: 10

  docker:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
